name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare Gradle wrapper
        run: chmod +x gradlew

      - name: Read version from tag
        id: version
        shell: bash
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TABATAKI_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing TABATAKI_KEYSTORE_BASE64 secret"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tabataki-release.jks"

      - name: Test and build signed release APK
        env:
          TABATAKI_KEYSTORE_FILE: ${{ runner.temp }}/tabataki-release.jks
          TABATAKI_KEYSTORE_PASSWORD: ${{ secrets.TABATAKI_KEYSTORE_PASSWORD }}
          TABATAKI_KEY_ALIAS: ${{ secrets.TABATAKI_KEY_ALIAS }}
          TABATAKI_KEY_PASSWORD: ${{ secrets.TABATAKI_KEY_PASSWORD }}
          TABATAKI_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          TABATAKI_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: ./gradlew testDebugUnitTest assembleRelease --stacktrace

      - name: Rename APK
        shell: bash
        run: cp app/build/outputs/apk/release/app-release.apk "Tabataki-${{ steps.version.outputs.version_name }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Tabataki-${{ steps.version.outputs.version_name }}.apk
          generate_release_notes: true
          name: Tabataki ${{ steps.version.outputs.version_name }}
