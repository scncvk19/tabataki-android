name: Android Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "RELEASE_VERSION"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare Gradle wrapper
        run: chmod +x gradlew

      - name: Read release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="$(tr -d '[:space:]' < RELEASE_VERSION)"
          fi

          if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use MAJOR.MINOR.PATCH, for example 1.0.11"
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          VERSION_CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TABATAKI_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing TABATAKI_KEYSTORE_BASE64 secret"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tabataki-release.jks"

      - name: Test and build signed release APK
        env:
          TABATAKI_KEYSTORE_FILE: ${{ runner.temp }}/tabataki-release.jks
          TABATAKI_KEYSTORE_PASSWORD: ${{ secrets.TABATAKI_KEYSTORE_PASSWORD }}
          TABATAKI_KEY_ALIAS: ${{ secrets.TABATAKI_KEY_ALIAS }}
          TABATAKI_KEY_PASSWORD: ${{ secrets.TABATAKI_KEY_PASSWORD }}
          TABATAKI_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          TABATAKI_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: ./gradlew testDebugUnitTest assembleRelease --stacktrace

      - name: Rename APK
        shell: bash
        run: cp app/build/outputs/apk/release/app-release.apk "Tabataki-${{ steps.version.outputs.version_name }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          target_commitish: ${{ github.sha }}
          files: Tabataki-${{ steps.version.outputs.version_name }}.apk
          generate_release_notes: true
          name: Tabataki ${{ steps.version.outputs.version_name }}
